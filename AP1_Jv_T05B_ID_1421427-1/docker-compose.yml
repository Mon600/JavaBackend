name: tictactoe-t05b

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tictactoe}
      POSTGRES_USER: ${DB_USER:-tictactoe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tictactoe_dev_password}
    ports:
      # Только на localhost хоста — для psql / IDE, наружу БД не публикуется
      - "127.0.0.1:${DB_HOST_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tictactoe-t05b:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Эти имена читает application.properties: ${DB_URL}, ${DB_USER}, ${DB_PASSWORD}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-tictactoe}
      DB_USER: ${DB_USER:-tictactoe}
      DB_PASSWORD: ${DB_PASSWORD:-tictactoe_dev_password}
      # Читается в JwtProvider через @Value("${SECRET_KEY_JWT}"), минимум 32 байта (HS256)
      SECRET_KEY_JWT: ${SECRET_KEY_JWT:-dev-only-secret-change-me-0123456789abcdef0123456789}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    ports:
      - "${APP_PORT:-8080}:8080"
      # Удалённая отладка (раскомментируйте и добавьте в JAVA_OPTS агент jdwp, см. README):
      # - "127.0.0.1:5005:5005"
    # server.shutdown=graceful + spring.lifecycle.timeout-per-shutdown-phase=30s
    stop_grace_period: 40s
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
